project_id = "voixel-telecom"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback"]
enable_signup = true
jwt_expiry = 3600
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"
[auth.email.template.confirmation]
subject = "Verify your email address | Voixel"
content_path = "./templates/confirmation.html"
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
